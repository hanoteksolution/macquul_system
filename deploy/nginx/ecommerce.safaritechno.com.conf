# E-commerce on safaritechno.com — separate portals on one domain
#
# DNS: A record ecommerce.safaritechno.com → 88.222.220.238
#
# Portals:
#   https://ecommerce.safaritechno.com/         — customer storefront
#   https://ecommerce.safaritechno.com/manage/  — admin portal (Next.js)
#   https://ecommerce.safaritechno.com/api/     — REST API
#
# Optional (add DNS A admin.ecommerce → same IP):
#   https://admin.ecommerce.safaritechno.com/   — admin portal (subdomain)
#
# Docker: docker compose --env-file .env up -d
#   API:        127.0.0.1:8020
#   Storefront: 127.0.0.1:3002
#   Admin app:  127.0.0.1:3010

upstream ecommerce_backend {
    server 127.0.0.1:8020;
    keepalive 8;
}

upstream ecommerce_storefront {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream ecommerce_admin_portal {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name ecommerce.safaritechno.com;

    client_max_body_size 50M;
    access_log /var/log/nginx/ecommerce.safaritechno.com_access.log;
    error_log /var/log/nginx/ecommerce.safaritechno.com_error.log;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/html;
    }

    location /api/ {
        proxy_pass http://ecommerce_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /media/ {
        proxy_pass http://ecommerce_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django superuser / model admin (not the Next.js admin portal)
    location /django-admin/ {
        proxy_pass http://ecommerce_backend/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js admin portal (ADMIN_BASE_PATH=/manage)
    location /manage {
        proxy_pass http://ecommerce_admin_portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://ecommerce_storefront;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

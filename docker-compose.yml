services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ecommerce_db}
      POSTGRES_USER: ${DB_USER:-ecom_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strongpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER:-ecom_user} -d ${DB_NAME:-ecommerce_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./ecommerce_backend
    restart: unless-stopped
    ports:
      - "0.0.0.0:${API_HOST_PORT:-8001}:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-change-me}
      DEBUG: ${DEBUG:-True}
      DB_NAME: ${DB_NAME:-ecommerce_db}
      DB_USER: ${DB_USER:-ecom_user}
      DB_PASSWORD: ${DB_PASSWORD:-strongpassword}
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./ecommerce_backend:/app
      - backend_media:/app/media
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./ecommerce_client
    restart: unless-stopped
    ports:
      - target: 3000
        published: ${CLIENT_HOST_PORT:-3002}
        protocol: tcp
        host_ip: 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./ecommerce_client:/app
      - client_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000',r=>{r.resume();process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      - backend

  admin:
    build:
      context: ./ecommerce_admin
    restart: unless-stopped
    ports:
      - target: 3001
        published: ${ADMIN_HOST_PORT:-3003}
        protocol: tcp
        host_ip: 0.0.0.0
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./ecommerce_admin:/app
      - admin_node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3001',r=>{r.resume();process.exit(r.statusCode<500?0:1)}).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
  client_node_modules:
  admin_node_modules:
